<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIMA · Regulatory Horizon Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    /* ===== SIMA brand — swap for exact hex from brand guidelines ===== */
    --brand:#262161;       /* SIMA navy */
    --brand-deep:#181442;
    --gold:#CDAA04;        /* SIMA gold mark */
    --gold-deep:#A98A03;
    --page:#FCFBF5;        /* warm cream */
    /* ================================================================ */
    --surface:#FFFFFF;
    --surface-2:#F7F5EC;
    --ink:#262A3B;
    --ink-soft:#474C60;
    --muted:#74798C;
    --line:#DCDDEB;
    --line-strong:#C4C6DE;
    --high:#C0392B;
    --med:#C0851A;
    --low:#2E8B6E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--page);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}

  /* ---------- Brand bar ---------- */
  .topbar{background:var(--page);}
  .topbar-inner{max-width:1120px;margin:0 auto;padding:22px 28px 8px;display:flex;align-items:center;gap:18px;}
  .logo{height:60px;width:auto;display:block;}
  .logo-fallback{font-family:"Poppins",sans-serif;font-weight:800;font-size:30px;letter-spacing:.02em;color:var(--brand);display:none;}
  .logo-fallback i{color:var(--gold);font-style:normal;}
  .brand-divider{width:1px;height:40px;background:var(--line-strong);}
  .app-name{display:flex;flex-direction:column;line-height:1.2;}
  .app-name .t{font-family:"Poppins",sans-serif;font-weight:700;font-size:17px;color:var(--brand);}
  .app-name .s{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px;}
  .topbar-right{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;line-height:1.7;}
  .topbar-right b{color:var(--brand);font-weight:600;}

  /* ---------- Tabs (SIMA nav style) ---------- */
  .tabstrip{max-width:1120px;margin:0 auto;padding:0 28px;border-bottom:2px solid var(--brand);display:flex;}
  .tab{appearance:none;background:none;cursor:pointer;font-family:"Poppins",sans-serif;font-size:14px;font-weight:600;color:var(--brand);padding:14px 26px;border:none;border-left:1px solid var(--line-strong);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .14s;}
  .tab:first-child{border-left:none;padding-left:4px;}
  .tab:hover{color:var(--gold-deep);}
  .tab.active{border-bottom-color:var(--gold);}
  .tab .count{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;background:var(--gold);color:var(--brand-deep);border-radius:999px;padding:1px 8px;margin-left:9px;}

  .wrap{max-width:1120px;margin:0 auto;padding:34px 28px 90px;}
  .panel{display:none;}
  .panel.active{display:block;}

  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:6px;}
  h2.sec-title{font-family:"Poppins",sans-serif;font-size:27px;font-weight:700;letter-spacing:-0.01em;color:var(--brand);margin:0;}
  .lede{font-size:16px;color:var(--ink-soft);max-width:680px;margin:8px 0 0;}
  .lede b{color:var(--brand);font-weight:700;}

  /* ---------- Buttons ---------- */
  .btn{appearance:none;cursor:pointer;font-family:"Manrope",sans-serif;font-size:13.5px;font-weight:700;letter-spacing:.01em;padding:11px 18px;border-radius:8px;border:1px solid transparent;transition:all .13s;display:inline-flex;align-items:center;gap:8px;}
  .btn-primary{background:var(--brand);color:#fff;}
  .btn-primary:hover{background:var(--brand-deep);}
  .btn-gold{background:var(--gold);color:var(--brand-deep);}
  .btn-gold:hover{background:var(--gold-deep);color:#fff;}
  .btn-ghost{background:var(--surface);color:var(--brand);border-color:var(--line-strong);}
  .btn-ghost:hover{border-color:var(--brand);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn svg,.btn-mini svg{width:15px;height:15px;}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:24px 0 22px;padding:15px 18px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;}
  .toolbar .lbl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
  .chipset{display:flex;gap:6px;flex-wrap:wrap;}
  .fchip{appearance:none;cursor:pointer;font-family:"Manrope",sans-serif;font-size:12.5px;font-weight:600;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);padding:6px 13px;border-radius:999px;transition:all .12s;}
  .fchip:hover{border-color:var(--brand);}
  .fchip.on{background:var(--brand);color:#fff;border-color:var(--brand);}

  /* ---------- Cards ---------- */
  .cards{display:grid;gap:16px;}
  .card{background:var(--surface);border:1.5px solid var(--line-strong);border-radius:16px;padding:22px 24px;position:relative;transition:box-shadow .15s,border-color .15s;}
  .card:hover{box-shadow:0 8px 26px rgba(35,43,110,.09);border-color:var(--brand);}
  .card.flag-high{border-left:4px solid var(--high);}
  .card-top{display:flex;align-items:center;gap:10px;margin-bottom:11px;flex-wrap:wrap;}
  .juris-tag{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.06em;background:var(--brand);color:#fff;padding:3px 9px;border-radius:5px;}
  .reg-tag{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);}
  .card-date{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.05em;color:var(--ink-soft);}
  .card h3{font-family:"Poppins",sans-serif;font-size:19px;font-weight:600;line-height:1.32;margin:0 0 8px;color:var(--brand);}
  .card p.summary{margin:0 0 16px;color:var(--ink-soft);font-size:14.5px;max-width:780px;}
  .meta-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .pill{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:5px;border:1px solid var(--line-strong);color:var(--ink-soft);background:var(--surface-2);}
  .impact .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle;position:relative;top:-1px;}
  .impact.High .dot{background:var(--high);}
  .impact.Medium .dot{background:var(--med);}
  .impact.Low .dot{background:var(--low);}
  .card-actions{margin-left:auto;display:flex;align-items:center;gap:14px;}
  .btn-mini{appearance:none;cursor:pointer;font-family:"Manrope",sans-serif;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:7px;border:1px solid var(--gold);background:var(--gold);color:var(--brand-deep);transition:all .12s;}
  .btn-mini:hover{background:var(--gold-deep);border-color:var(--gold-deep);color:#fff;}
  .src{font-family:"Manrope",sans-serif;font-size:12.5px;font-weight:700;color:var(--brand);text-decoration:none;white-space:nowrap;}
  .src:hover{text-decoration:underline;}

  /* ---------- Archive ---------- */
  .archive-intro{font-size:16px;color:var(--ink-soft);max-width:680px;margin:8px 0 26px;}
  .form{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:26px;}
  .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 24px;}
  .field{display:flex;flex-direction:column;gap:7px;}
  .field label{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);}
  .field input,.field select{font-family:"Manrope",sans-serif;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;width:100%;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(35,43,110,.1);}
  .form-actions{display:flex;gap:12px;align-items:center;margin-top:24px;padding-top:22px;border-top:1px solid var(--line);flex-wrap:wrap;}
  .result-note{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);margin-left:auto;}
  .result-note b{color:var(--brand);}
  .preview{margin-top:30px;}
  .preview h4{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 12px;}
  .tbl-scroll{overflow:auto;max-height:520px;border:1.5px solid var(--line);border-radius:12px;}
  thead th{position:sticky;top:0;}
  .tbl-dl{appearance:none;cursor:pointer;font-family:"Manrope",sans-serif;font-size:11px;font-weight:700;padding:5px 10px;border-radius:6px;border:1px solid var(--gold);background:var(--gold);color:var(--brand-deep);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:all .12s;}
  .tbl-dl:hover{background:var(--gold-deep);border-color:var(--gold-deep);color:#fff;}
  .tbl-dl svg{width:12px;height:12px;}
  table{border-collapse:collapse;width:100%;font-size:13px;}
  thead th{background:var(--brand);color:#fff;text-align:left;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:500;padding:11px 13px;white-space:nowrap;}
  tbody td{padding:11px 13px;border-top:1px solid var(--line);color:var(--ink-soft);vertical-align:top;}
  tbody tr:nth-child(even){background:var(--surface-2);}
  td.t-title{color:var(--brand);font-weight:600;min-width:240px;}
  td.t-mono{font-family:"IBM Plex Mono",monospace;font-size:12px;white-space:nowrap;}
  .empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:16px;}

  @media(max-width:680px){
    .card-date{margin-left:0;}
    .card-actions{margin-left:0;width:100%;justify-content:space-between;margin-top:8px;}
    .form-grid{grid-template-columns:1fr;}
    .topbar-right{display:none;}
    .tabstrip,.topbar-inner,.wrap{padding-left:18px;padding-right:18px;}
  }
</style>
</head>

  {"Record ID": "REG-00005", "Jurisdiction_Country": "Canada", "Jurisdiction_Prov": "", "Regulator": "Canadian Investment Regulatory Organization (CIRO)", "Region": "North America", "Market Type": "Equity; Fixed Income; Investment Funds", "Regulation Title": "CIRO 2027 Annual Priorities", "Regulation Type": "Policy Statement", "Change Category": "", "Topic Area": "Investor Protection", "Sub-Topic": "", "Summary Short": "CIRO releases 2027 Annual Priorities focusing on integration completion, cyber resilience, complaint handling review, and investor protection initiatives.", "Summary Long": "CIRO announced its fiscal year 2027 Annual Priorities (April 1, 2026–March 31, 2027), the final year of its 2025–2027 Strategic Plan. Key initiatives include: completing integration activities and publishing a harmonized rulebook consolidating dealer and mutual fund dealer rules; advancing investor protection through fraudulent website removal, account transfer improvements, and complaint handling timeline review; modernizing regulatory approach via technology, automation, and expanded InnovateSafe sandbox; strengthening cyber resilience through new data frameworks; assessing tailored online advice regulatory framework; operationalizing delegated registration responsibilities across Canada; and publishing the first annual Market Regulation report with UMIR review.", "Announcement Date": "2026-04-07", "Effective Date": "", "Compliance Date": "", "Comment Deadline": "", "Implementation Phase": "", "Status": "Active", "Impact Level": "Medium", "Impact Type": "Compliance; Operational; Strategic", "Affected Functions": "Compliance; Registration; Market Regulation; Risk; IT", "Affected Products": "Investment Dealer Services; Mutual Fund Dealer Services; Equity Trading; Debt Trading", "Extraterritorial Impact": "No", "Cross-Border Relevance": "No", "SIMA Owner": "", "SIMA Policy Group": "Capital Markets", "Action Required": "Monitor", "Action Description": "Monitor CIRO's 2027 Annual Pr function rec(id,country,prov,reg,title,rtype,change,topic,summary,ann,eff,comp,deadline,phase,status,impact,impactType,link){
  return {"Record ID":id,"Jurisdiction_Country":country,"Jurisdiction_Prov":prov,"Regulator":reg,
    "Region":["United States","Canada","Canada (National)"].includes(country)?"North America":(["United Kingdom","European Union"].includes(country)?"Europe":"Asia-Pacific"),
    "Market Type":"All","Regulation Title":title,"Regulation Type":rtype,"Change Category":change,"Topic Area":topic,
    "Sub-Topic":"","Summary Short":summary,"Summary Long":"","Announcement Date":ann,"Effective Date":eff,
    "Compliance Date":comp,"Comment Deadline":deadline,"Implementation Phase":phase,"Status":status,
    "Impact Level":impact,"Impact Type":impactType,"Affected Functions":"","Affected Products":"",
    "Action Required":impact==="High"?"Yes":"No","SIMA Owner":"","SIMA Policy Group":"","Status (Internal)":"",
    "Source Type":"Regulator","Source Link":link};
}

const EXPORT_COLUMNS=["Record ID","Jurisdiction_Country","Jurisdiction_Prov","Regulator","Region","Market Type","Regulation Title","Regulation Type","Change Category","Topic Area","Sub-Topic","Summary Short","Summary Long","Announcement Date","Effective Date","Compliance Date","Comment Deadline","Implementation Phase","Status","Impact Level","Impact Type","Affected Functions","Affected Products","Action Required","SIMA Owner","SIMA Policy Group","Status (Internal)","Source Type","Source Link"];

function parseD(s){return s?new Date(s+"T00:00:00"):null;}
function fmtDate(s){const d=parseD(s);if(!d)return"";return d.toLocaleDateString("en-CA",{day:"2-digit",month:"short",year:"numeric"}).toUpperCase();}
function jcode(r){return JCODE[r.Jurisdiction_Prov]||JCODE[r.Jurisdiction_Country]||"—";}
function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);}
function regAbbr(name){const m={"Ontario Securities Commission":"OSC","British Columbia Securities Commission":"BCSC","Alberta Securities Commission":"ASC","Autorité des marchés financiers":"AMF","Canadian Securities Administrators":"CSA","Financial and Consumer Services Commission":"FCNB","Securities and Exchange Commission":"SEC","Commodity Futures Trading Commission":"CFTC","Financial Crimes Enforcement Network":"FinCEN","Financial Conduct Authority":"FCA","European Securities and Markets Authority":"ESMA","European Banking Authority":"EBA","Australian Securities & Investments Commission":"ASIC","China Securities Regulatory Commission":"CSRC"};return m[name]||name;}

function exportToExcel(records,filename,sheetName){
  if(!records.length)return;
  const aoa=[EXPORT_COLUMNS,...records.map(r=>EXPORT_COLUMNS.map(c=>r[c]??""))];
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"]=EXPORT_COLUMNS.map(c=>({wch:c==="Summary Short"?60:(c==="Regulation Title"?42:16)}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,sheetName||"Regulatory Changes");
  XLSX.writeFile(wb,filename);
}

/* ============ THIS WEEK ============ */
const allDates=RECORDS.map(r=>parseD(r["Announcement Date"])).filter(Boolean);
const latest=new Date(Math.max(...allDates));
const weekStart=new Date(latest);weekStart.setDate(weekStart.getDate()-7);
const isThisWeek=r=>{const d=parseD(r["Announcement Date"]);return d&&d>weekStart&&d<=latest;};
const weekRecords=RECORDS.filter(isThisWeek).sort((a,b)=>parseD(b["Announcement Date"])-parseD(a["Announcement Date"]));

document.getElementById("issueDate").textContent=fmtDate(latest.toISOString().slice(0,10));
document.getElementById("weekCount").textContent=weekRecords.length;
const jc=new Set(weekRecords.map(r=>r.Jurisdiction_Prov||r.Jurisdiction_Country)).size;
const hc=weekRecords.filter(r=>r["Impact Level"]==="High").length;
document.getElementById("weekLede").innerHTML=`<b>${weekRecords.length} new ${weekRecords.length===1?"change":"changes"}</b> across ${jc} ${jc===1?"jurisdiction":"jurisdictions"} in the week of ${fmtDate(weekStart.toISOString().slice(0,10))}`+(hc?`, including <b>${hc} high-impact</b>.`:".");

let activeImpact="all";
const weekVisible=()=>weekRecords.filter(r=>activeImpact==="all"||r["Impact Level"]===activeImpact);

function renderWeek(){
  const list=document.getElementById("weekList");
  const rows=weekVisible();
  if(!rows.length){list.innerHTML=`<div class="empty">No ${activeImpact} items this week.</div>`;return;}
  list.innerHTML=rows.map(r=>`
    <article class="card ${r["Impact Level"]==="High"?"flag-high":""}">
      <div class="card-top">
        <span class="juris-tag">${jcode(r)}</span>
        <span class="reg-tag">${regAbbr(r.Regulator)}</span>
        <span class="card-date">${fmtDate(r["Announcement Date"])}</span>
      </div>
      <h3>${r["Regulation Title"]}</h3>
      <p class="summary">${r["Summary Short"]}</p>
      <div class="meta-row">
        ${r["Topic Area"]?`<span class="pill">${r["Topic Area"]}</span>`:""}
        ${r["Change Category"]?`<span class="pill">${r["Change Category"]}</span>`:""}
        <span class="pill impact ${r["Impact Level"]}"><span class="dot"></span>${r["Impact Level"]} impact</span>
        <span class="card-actions">
          <button class="btn-mini" data-id="${r["Record ID"]}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
            Download Excel
          </button>
          <a class="src" href="${r["Source Link"]}" target="_blank" rel="noopener">View source ↗</a>
        </span>
      </div>
    </article>`).join("");
}

document.getElementById("impactFilter").addEventListener("click",e=>{
  const b=e.target.closest(".fchip");if(!b)return;
  activeImpact=b.dataset.impact;
  document.querySelectorAll("#impactFilter .fchip").forEach(c=>c.classList.toggle("on",c===b));
  renderWeek();
});

// per-article download (event delegation)
document.getElementById("weekList").addEventListener("click",e=>{
  const b=e.target.closest(".btn-mini");if(!b)return;
  const r=RECORDS.find(x=>x["Record ID"]===b.dataset.id);if(!r)return;
  exportToExcel([r],`reg_${r["Record ID"]}_${slugify(r["Regulation Title"])}.xlsx`,"Record");
});

// download all (current filter)
document.getElementById("weekDownload").addEventListener("click",()=>{
  const rows=weekVisible();if(!rows.length)return;
  exportToExcel(rows,`reg_this_week_${latest.toISOString().slice(0,10)}.xlsx`,"This Week");
});
renderWeek();

/* ============ ARCHIVE ============ */
const topicSel=document.getElementById("topic");
const TOPIC_OPTS=[...new Set(RECORDS.map(r=>r["Topic Area"]).filter(Boolean))].sort();
topicSel.innerHTML=`<option value="all">All topics</option>`+TOPIC_OPTS.map(t=>`<option value="${t}">${t}</option>`).join("");
const jurisList=[...new Set(RECORDS.map(r=>r.Jurisdiction_Prov||r.Jurisdiction_Country))].sort();
document.getElementById("juris").innerHTML=`<option value="all">All jurisdictions</option>`+jurisList.map(j=>`<option value="${j}">${j}</option>`).join("");

const fromInput=document.getElementById("fromDate"),toInput=document.getElementById("toDate");
const def90=new Date(latest);def90.setDate(def90.getDate()-90);
fromInput.value=def90.toISOString().slice(0,10);
toInput.value=latest.toISOString().slice(0,10);
let lastResults=[];

function runQuery(){
  const from=parseD(fromInput.value),to=parseD(toInput.value);
  const topic=topicSel.value,juris=document.getElementById("juris").value;
  return RECORDS.filter(r=>{
    const d=parseD(r["Announcement Date"]);if(!d)return false;
    if(from&&d<from)return false;
    if(to&&d>to)return false;
    if(topic!=="all"&&r["Topic Area"]!==topic)return false;
    if(juris!=="all"&&r.Jurisdiction_Prov!==juris&&r.Jurisdiction_Country!==juris)return false;
    return true;
  }).sort((a,b)=>parseD(b["Announcement Date"])-parseD(a["Announcement Date"]));
}

document.getElementById("buildBtn").addEventListener("click",()=>{
  lastResults=runQuery();
  document.getElementById("resultNote").innerHTML=`<b>${lastResults.length}</b> record${lastResults.length===1?"":"s"} matched`;
  document.getElementById("downloadBtn").disabled=lastResults.length===0;
  const prev=document.getElementById("preview");prev.style.display="block";
  if(!lastResults.length){
    document.getElementById("previewHeading").textContent="Preview";
    document.getElementById("previewTable").innerHTML=`<tbody><tr><td class="empty" style="border:none">No records in this window. Widen the dates or clear a filter.</td></tr></tbody>`;
    return;
  }
  document.getElementById("previewHeading").textContent=`${lastResults.length} matching record${lastResults.length===1?"":"s"} — download all above, or any single row below`;
  const cols=["Date","Jurisdiction","Regulator","Topic Area","Impact","Regulation Title","Excel"];
  const head=`<thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead>`;
  const body=`<tbody>${lastResults.map(r=>`<tr>
    <td class="t-mono">${fmtDate(r["Announcement Date"])}</td>
    <td>${r.Jurisdiction_Prov||r.Jurisdiction_Country}</td>
    <td>${regAbbr(r.Regulator)}</td>
    <td>${r["Topic Area"]}</td>
    <td class="t-mono">${r["Impact Level"]}</td>
    <td class="t-title">${r["Regulation Title"]}</td>
    <td><button class="tbl-dl" data-id="${r["Record ID"]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>Excel</button></td></tr>`).join("")}</tbody>`;
  document.getElementById("previewTable").innerHTML=head+body;
});
document.getElementById("downloadBtn").addEventListener("click",()=>{
  if(!lastResults.length)return;
  exportToExcel(lastResults,`reg_archive_${fromInput.value}_to_${toInput.value}.xlsx`,"Archive");
});
document.getElementById("previewTable").addEventListener("click",e=>{
  const b=e.target.closest(".tbl-dl");if(!b)return;
  const r=RECORDS.find(x=>x["Record ID"]===b.dataset.id);if(!r)return;
  exportToExcel([r],`reg_${r["Record ID"]}_${slugify(r["Regulation Title"])}.xlsx`,"Record");
});
document.getElementById("resetBtn").addEventListener("click",()=>{
  fromInput.value=def90.toISOString().slice(0,10);toInput.value=latest.toISOString().slice(0,10);
  topicSel.value="all";document.getElementById("juris").value="all";
  document.getElementById("preview").style.display="none";
  document.getElementById("resultNote").textContent="";
  document.getElementById("downloadBtn").disabled=true;lastResults=[];
});

/* ============ TABS ============ */
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    document.getElementById("panel-"+t.dataset.tab).classList.add("active");
  });
});
</script>
</body>
</html>
